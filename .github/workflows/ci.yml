name: CI

on:
  pull_request:          # every PR, and every push to a PR
  push:
    branches: [main]     # every merge to main

permissions:
  contents: read         # default for every job: read the code only

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install app + dev tools (pinned, with hashes)
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  build:
    needs: test          # only build if the tests passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write    # lets this job ask GitHub for the token that WIF trades for Google access
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t querybuilder:${{ github.sha }} .
      - name: Start container
        run: docker run -d --name app -p 8080:8080 querybuilder:${{ github.sha }}
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/health && break
            sleep 1
          done
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ | grep -q "Mongo query builder"
          curl -fsS -X POST http://localhost:8080/api/build \
            -H 'Content-Type: application/json' \
            -d '{"collection":"quotes","rows":[{"field":"pe_ratio","op":"less than","value":"20"}]}'
      - name: Runs as non-root user
        run: test "$(docker exec app whoami)" = appuser
      - name: Show container logs if something failed
        if: failure()
        run: docker logs app

      - name: Log in to Google Cloud (main only)
        id: auth
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/868391218499/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-ci-deployer@jbs-ci-lab.iam.gserviceaccount.com
          token_format: access_token

      - name: Push image to Artifact Registry (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: us-east1-docker.pkg.dev/jbs-ci-lab/querybuilder/querybuilder:${{ github.sha }}
        run: |
          echo "${{ steps.auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin https://us-east1-docker.pkg.dev
          docker tag querybuilder:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
          echo "Pushed $IMAGE"

  deploy:
    needs: build         # only deploy an image that was built, tested and pushed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write    # for WIF, like the build job
    steps:
      - name: Log in to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/868391218499/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-ci-deployer@jbs-ci-lab.iam.gserviceaccount.com

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy querybuilder \
            --image=us-east1-docker.pkg.dev/jbs-ci-lab/querybuilder/querybuilder:${{ github.sha }} \
            --region=us-east1 \
            --service-account=app-runtime@jbs-ci-lab.iam.gserviceaccount.com \
            --project=jbs-ci-lab \
            --quiet

      - name: Smoke test the live service
        run: |
          URL=$(gcloud run services describe querybuilder --region=us-east1 --project=jbs-ci-lab --format='value(status.url)')
          curl -fsS "$URL/health"
          echo "Live at $URL"
